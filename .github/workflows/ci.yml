name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only: every commit on main gets its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every check step is a plain command that runs the same way locally (BE-12-T04). The syntax check and the raw
# control-character check live in scripts/static-checks.mjs (`syntax`, `controlCharacters`).
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Tests with the coverage gate
        run: node node_modules/jest/bin/jest.js --runInBand --coverage
      - name: Static checks, including the per-file coverage floor
        run: node scripts/static-checks.mjs --coverage-summary coverage/coverage-summary.json
      - name: Whitespace in this change
        # Two commits are fetched: HEAD^ is the parent on a push to main and the base branch's tip on a pull request's merge
        # commit. A bare `git diff --check` compares the working tree with the index, which is always clean on a runner.
        run: git diff --check HEAD^ HEAD
      - name: Audit what ships (after the tests, so an advisory never hides a test result)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit dev dependencies (reported, not blocking; they are not in the image)
        run: npm audit --audit-level=high || echo "::warning::dev-dependency advisories above; they do not ship in the image"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --pull -t your-guava-api:ci .
      - name: Start a single-node replica set
        run: |
          docker network create guava-ci
          docker run -d --name mongo --network guava-ci mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "let ok=0; try { ok=rs.status().ok } catch (e) { ok=rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok } quit(ok ? 0 : 1)"; then break; fi
            sleep 2
          done
      - name: Run the image as it ships and wait for its own HEALTHCHECK
        # NODE_ENV=development: production validateEnv needs the owner's live credentials, which CI must not hold. The build,
        # the --omit=dev install, the non-root user, the start command and the HEALTHCHECK are exactly what ships.
        run: |
          docker run -d --name api --network guava-ci -p 5000:5000 \
            -e NODE_ENV=development \
            -e CLIENT_URL=http://localhost:5185 \
            -e MONGODB_URI='mongodb://mongo:27017/guava-ci?replicaSet=rs0' \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e DOWNLOAD_SIGNING_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_CONSOLE_LINKS=true \
            your-guava-api:ci
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            if [ "$status" = healthy ] || [ "$status" = unhealthy ]; then break; fi
            sleep 3
          done
          docker logs api 2>&1 | tail -40
          curl -fsS http://localhost:5000/api/health
          test "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy
          test "$(docker exec api id -u)" != 0
